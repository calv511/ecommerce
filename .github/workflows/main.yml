name: Ecommerce APP CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Continuous Integration: install, test, build.
  # Any failing step fails the job, and the deploy job below refuses to start
  # unless this one succeeds.
  # ---------------------------------------------------------------------------
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      # Node 24 matches local development and ships npm 11.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run unit and integration tests with Jest.
      # --ci makes Jest fail on a missing snapshot instead of writing one,
      # so a deleted snapshot cannot quietly pass.
      - name: Run tests
        run: npm test -- --ci

      # Step 5: Build React app
      - name: Build React App
        run: npm run build

  # ---------------------------------------------------------------------------
  # Continuous Deployment: publish to Vercel.
  #
  # `needs: build` is what enforces the gate — GitHub will not start this job
  # until the build job has finished successfully, so failing tests block the
  # deployment rather than merely reporting alongside it.
  #
  # The `if` guard keeps deploys to real pushes on main. Pull requests still run
  # CI above, but must not publish to production.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Vercel
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # Fails fast with a readable message when a secret is missing. Without
      # this, the CLI reports "Could not retrieve Project Settings ... remove
      # the .vercel directory", which is misleading on a runner that has no
      # .vercel directory in the first place.
      - name: Verify Vercel secrets are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Missing or empty repository secret(s):$missing"
            echo ""
            echo "Run 'npx vercel link' in the project, then copy orgId and"
            echo "projectId from .vercel/project.json into repository secrets."
            exit 1
          fi
          # Lengths only — enough to spot an empty or truncated paste.
          echo "VERCEL_ORG_ID length: ${#VERCEL_ORG_ID}"
          echo "VERCEL_PROJECT_ID length: ${#VERCEL_PROJECT_ID}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pulls the project's production settings (framework, env vars) from
      # Vercel so the build below matches what Vercel would have produced.
      # Diagnostic: shows which account the token authenticates as and which
      # projects it can see. If the token's scope does not cover the project
      # that VERCEL_PROJECT_ID names, `vercel pull` fails with a message that
      # blames the .vercel directory instead. Never fails the job.
      - name: Diagnose Vercel access
        continue-on-error: true
        run: |
          echo "--- authenticated as ---"
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }} || true
          echo "--- teams this token can see ---"
          vercel teams ls --token=${{ secrets.VERCEL_TOKEN }} || true
          echo "--- projects this token can see ---"
          vercel project ls --token=${{ secrets.VERCEL_TOKEN }} || true

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --prebuilt uploads the artifact built in the step above rather than
      # rebuilding on Vercel, so what ships is what CI just verified.
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
